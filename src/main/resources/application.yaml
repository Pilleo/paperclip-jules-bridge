server:
  port: 8080

spring:
  application:
    name: paperclip-jules-bridge
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:runs.sqlite
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

bridge:
  authToken: default-auth-token
  allowedRepositories: Pilleo/mazewall
  invariantsFile: /config/invariants.md

jules:
  apiBaseUrl: https://jules.googleapis.com/v1alpha
  apiKey: default-jules-key
  requirePlanApproval: false
  automationMode: "AUTO_CREATE_PR"

paperclip:
  baseUrl: http://localhost:8080
  apiToken: default-paperclip-token

polling:
  intervalSeconds: 45
  maxSessionAgeHours: 12
